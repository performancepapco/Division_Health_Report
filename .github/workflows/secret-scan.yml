name: Secret Scan

# Split out of pipeline.yml — gitleaks-action needs a push/PR's before-and-
# after commits to diff against, and explicitly errors out on
# repository_dispatch (the trigger the data pipeline actually runs on most
# of the time). Scanning code changes belongs on push anyway, not on a
# workflow that fires several times a day for unrelated data updates.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
