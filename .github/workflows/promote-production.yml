name: Promote to Production

# The manual approval gate. GitHub Environments' "required reviewers"
# protection rule needs a paid plan for a private repo (this one goes
# private in Phase 6, on the Free plan) — so instead of that, promotion is
# just: you look at staging, then run this workflow yourself.
#
# Click-path from the GitHub mobile app:
#   Repo -> Actions tab -> "Promote to Production" (left sidebar) ->
#   Run workflow -> Run workflow (green button, no inputs needed).
#
# This does NOT rebuild or re-validate anything — it deploys exactly what's
# already committed on main (i.e. what Data Pipeline last validated and
# pushed to staging). Review the staging URL and the Data Pipeline run's
# summary (circle totals + biggest movers) before running this.
#
# Flip AUTO_PROMOTE to 'true' (Settings -> Secrets and variables -> Actions
# -> Variables) to skip this step entirely and have Data Pipeline deploy
# straight to production once you trust validation alone — see
# pipeline.yml's "Auto-promote to production" step.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public files
        # Same reasoning as pipeline.yml's "Stage public files" step —
        # only index.html + data/ should ever be publicly deployed.
        run: |
          mkdir -p dist/data
          cp index.html dist/
          cp data/latest.json dist/data/

      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=dhc-production --branch=main
